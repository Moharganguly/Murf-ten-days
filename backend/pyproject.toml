[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "day2-barista"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "livekit-agents==0.8.0",       # Strictly keep this stable version
    "livekit-plugins-openai",      # Let uv find the compatible version
    "livekit-plugins-deepgram",    # Let uv find the compatible version
    "livekit-plugins-silero",      # Let uv find the compatible version
    "python-dotenv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent.py"]
